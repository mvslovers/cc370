# Minimal CI for the cc370 toolchain.
#
# Scope is deliberately the five standalone tools and their suites, not the GCC
# fork: `make compiler` takes many minutes, and every regression this is meant
# to catch lives in the tools. Downstream projects (mbt's reusable workflow)
# already build the full toolchain from this repo's main, so a break here goes
# out to every consumer -- which is exactly what happened when a
# -Wformat-overflow error in xmit370 reached main and turned mvsmf's CI red.
#
# Both gcc and clang build the tools, on purpose. That bug slipped through
# local testing because Apple clang does not implement -Wformat-overflow at
# all, so a clang-only check is not enough to defend `-Werror`. Note the two
# compilers only differ for `make tools`; the test suites drive their own
# compiler.
#
# libc370 is checked out as a sibling because the as370 suite assembles four
# samples against its macro libraries (maclib/sysmac -- PDPTOP, SAVE, RETURN).
# Nothing is built from it; only the macro sources are read.
#
# Not included, and why:
#   test-corpus  a fresh libc370 clone carries only the 27 hand-written
#                asm/*.asm modules. The other 716 the local gate sweeps are
#                sdk/mklibc.py output and are in no commit, so CI would have to
#                build cc370 and regenerate them to cover them (#48). The gate
#                itself is no longer the obstacle -- since #48 it is differential
#                and green; wiring it in for the 27 would also need fetch-depth 0
#                so the baseline revision is present.
#   test-cc370   needs the GCC fork (`make compiler`)
#
# The `bookworm` job below exists because the matrix above covers two
# COMPILERS but one VERSION each, which is the same blind spot one level
# down from the one that put -Werror here.  ubuntu-latest's gcc did not
# diagnose ar370's exactly-sized `ar` header under -Wformat-truncation;
# Debian 12's gcc 12 did, as an error, so `make tools` failed on a common
# build host while CI stayed green (#452).  It is pinned BY DIGEST rather
# than by tag: ubuntu-latest moving under us is how this was missed, and a
# floating `debian:bookworm` would reintroduce exactly that.

name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tools:
    name: tools + suites (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: cc370
    steps:
      - uses: actions/checkout@v4
        with:
          path: cc370

      # The suites default to LIBC370=../../libc370, i.e. a sibling of the repo
      # root -- the same layout the ecosystem uses locally.
      - name: Clone libc370 (macro libraries only)
        working-directory: .
        run: git clone --depth 1 https://github.com/mvslovers/libc370.git libc370

      - name: Install compilers
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      # The -Werror build is the point of this job.
      - name: Build the standalone tools
        run: make tools HOSTCC=${{ matrix.cc }}

      - name: as370 suite (byte-identity to the IFOX00 reference decks)
        run: make test-as370

      - name: as370 listing references (IFOX00 SYSPRINT, column-exact)
        run: make test-listref

      - name: ld370 suite (byte-identity to the IEWL/IEBCOPY oracles)
        run: sh ld370/tests/run.sh

      - name: xmit370 suite
        run: make test-xmit370

  # A second GCC version, pinned, for the -Werror surface only.  The suites
  # are already covered above and are compiler-independent, so this builds
  # the tools and stops -- it is a diagnostic gate, not a second test run.
  bookworm:
    name: tools -Werror (gcc 12, Debian 12 pinned)
    runs-on: ubuntu-latest
    container:
      image: debian@sha256:704583dbf243593da87cf949fc0543ffeca24a28d36c2760dc9545410cb8ed02
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git

      - uses: actions/checkout@v4

      - name: Compiler version
        run: gcc --version

      # The point of the job: -Werror under a gcc that ubuntu-latest's does
      # not match.  A failure here is a real portability break on a stable
      # distro, not a stricter opinion.
      - name: Build the standalone tools
        run: make tools HOSTCC=gcc
