# Publish a GitHub release for a v* tag (#523), on libc370's pattern.
#
# 1. build.yml, unchanged: the tag has to build the tools under both compilers
#    and -Werror, and pass their suites.
# 2. The compiler.  build.yml leaves the GCC fork out because `make compiler`
#    takes minutes and every regression it guards lives in the tools; a
#    release is the one place that must prove `make compiler` works.  The
#    cc370 suite runs against it, and every binary -- the driver included --
#    has to report this version and the tagged commit (`make
#    test-version-cc370`), so a binary that is not the tag's cannot pass.
# 3. VERSION has to equal the tag without its "v".  A mismatch means the tag
#    sits on the wrong commit.
# 4. The notes are the tag's CHANGELOG.md section
#    (.github/scripts/changelog-section.py, libc370's script).  A tag without
#    a section fails here, so no release goes out without notes.
# 5. If the release already exists (made by hand, with curated notes), its
#    notes are left exactly as they are.
# 6. The assets (#523): package.yml builds the four tarballs and the .deb and
#    .rpm per Linux arch, each smoke-tested where it was built; this job adds
#    install.sh and a SHA256SUMS over all of them and attaches the lot.
#    The manuals (ML01-0001, ML01-0002) are built from the tag by build.yml's
#    `books` job and attached beside them, as ml01-000N-E.pdf.
# 7. Homebrew (#699): the formula is rendered from the release's SHA256SUMS
#    and pushed to mvslovers/homebrew-tap with the tap's deploy key, which
#    lives in the `release' environment and is handed only to v* tags.  Then
#    homebrew.yml installs it from the tap on every host.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  compiler:
    name: compiler + cc370 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the tools and the compiler
        run: make tools compiler

      - name: Every binary reports this version and the tagged commit
        run: make test-version-cc370

      - name: cc370 suite
        run: make test-cc370

  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: [build, compiler, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$have" != "$want" ]; then
            echo "::error::VERSION is '$have', the tag says '$want'"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: cc370-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: books
          path: assets

      - name: install.sh and SHA256SUMS
        run: |
          cp packaging/install.sh assets/
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: python3 .github/scripts/changelog-section.py "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; its notes are left as they are."
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "cc370 $GITHUB_REF_NAME" --notes-file notes.md assets/*
          fi

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Render Formula/cc370.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O sums
          sh packaging/homebrew/render.sh "${GITHUB_REF_NAME#v}" sums > cc370.rb

      - name: Push it to mvslovers/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone -q git@github.com:mvslovers/homebrew-tap.git tap
          cp cc370.rb tap/Formula/cc370.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cc370.rb
          if git diff --cached --quiet; then
            echo "Formula/cc370.rb already at ${GITHUB_REF_NAME#v}"
          else
            git commit -qm "cc370 ${GITHUB_REF_NAME#v}"
            git push -q origin HEAD:main
          fi
          rm -f ~/.ssh/tap

  homebrew-check:
    needs: homebrew
    uses: ./.github/workflows/homebrew.yml
