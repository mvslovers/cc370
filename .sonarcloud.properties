# SonarQube Cloud Automatic Analysis settings. SonarQube Cloud reads this
# file from the default branch.

# No custom target, unlike the projects that run on MVS (brexx370 and the
# others analyze for powerpc-unknown-eabi, the closest ILP32 big-endian
# target to S/370). What this repository builds runs on the HOST: as370,
# ld370, ar370, file370, xmit370, dasm370, cmplmd370, idrdump370, common/
# and the cc370 driver are 64-bit macOS/Linux programs, so the analyzer's
# default host model is the right one for them. The one exception is
# runtime/src (the @@ compiler helpers, 9 files), which cc370 compiles for
# MVS; findings there about pointer/integer widths need reading with that in
# mind.

# The GCC 3.4.6 fork is upstream code in K&R-era C; analyzing it would bury
# our own findings. Keep the i370 backend (cc370/gcc/config/i370), which is
# ours, and leave out the rest of the GCC tree and its support libraries.
# A single * does not cross a directory, so cc370/gcc/* excludes only the
# files at the top of cc370/gcc.
#
# docs/books holds the manuals; their example sources are figures, not
# product code.
sonar.exclusions=cc370/gcc/*,cc370/gcc/fixinc/**,cc370/gcc/ginclude/**,cc370/gcc/doc/**,cc370/gcc/config/host-linux.c,cc370/libiberty/**,cc370/intl/**,cc370/include/**,docs/books/**
